<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Whitelabel Error Page</title>
    <style>
        body {
          font-family: "Segoe UI", Tahoma, sans-serif;
          padding: 40px;
          background-color: #fafafa;
          color: #333;
        }
        h1 {
          color: #a94442;
        }
        .content {
          margin-top: 20px;
          padding: 20px;
          border: 1px solid #ddd;
          background: #fff;
          border-radius: 8px;
        }
        .timestamp {
          color: #777;
          font-size: 14px;
          margin-top: 20px;
        }
    </style>
</head>
<body>
<h1>Whitelabel Error Page</h1>
<div class="content">
    <p>This application has no explicit mapping for <code>/error</code>, so you are seeing this as a fallback.</p>
    <p><b>There was an unexpected error (type=Not Found, status=404).</b></p>
    <p>No message available</p>
</div>
<p class="timestamp">Timestamp: 2025-09-01T16:00:00</p>
<p class="timestamp">Path: /test</p>
</body>
</html>
